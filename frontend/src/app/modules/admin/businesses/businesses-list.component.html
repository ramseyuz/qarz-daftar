<div class="flex flex-col flex-auto min-w-0">

    <!-- Header -->
    <div class="flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between p-6 sm:py-8 sm:px-10 border-b bg-card dark:bg-transparent">
        <div class="flex-1 min-w-0">
            <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight leading-7 sm:leading-10 truncate">
                Businesses
            </h2>
            <p class="text-secondary mt-1 text-sm">Manage all registered businesses</p>
        </div>
        <button *ngIf="isSuperAdmin" mat-flat-button color="primary" (click)="openCreate()">
            <mat-icon svgIcon="heroicons_outline:plus"></mat-icon>
            <span class="ml-2">New Business</span>
        </button>
    </div>

    <!-- Content -->
    <div class="flex flex-col flex-auto p-6 sm:p-10">

        <!-- Search -->
        <mat-form-field class="w-full sm:w-80 mb-6">
            <mat-icon matPrefix svgIcon="heroicons_outline:magnifying-glass"></mat-icon>
            <input matInput placeholder="Search businesses..."
                [(ngModel)]="searchValue"
                (ngModelChange)="onSearch($event)">
        </mat-form-field>

        <!-- Spinner -->
        <div *ngIf="loading" class="flex justify-center py-16">
            <mat-progress-spinner mode="indeterminate" [diameter]="40"></mat-progress-spinner>
        </div>

        <!-- Table -->
        <div *ngIf="!loading" class="bg-card rounded-2xl shadow overflow-auto">
            <table mat-table [dataSource]="businesses" class="w-full">

                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>Name</th>
                    <td mat-cell *matCellDef="let b">
                        <span class="font-semibold">{{ b.name }}</span>
                    </td>
                </ng-container>

                <ng-container matColumnDef="phone">
                    <th mat-header-cell *matHeaderCellDef>Phone</th>
                    <td mat-cell *matCellDef="let b">{{ b.phone }}</td>
                </ng-container>

                <ng-container matColumnDef="address">
                    <th mat-header-cell *matHeaderCellDef>Address</th>
                    <td mat-cell *matCellDef="let b" class="text-secondary max-w-xs truncate">{{ b.address || '—' }}</td>
                </ng-container>

                <ng-container matColumnDef="total_debt">
                    <th mat-header-cell *matHeaderCellDef class="text-right">Total Debt</th>
                    <td mat-cell *matCellDef="let b" class="text-right font-medium">
                        {{ (b.total_debt_amount ?? 0) | number:'1.0-0' }} UZS
                    </td>
                </ng-container>

                <ng-container matColumnDef="total_remaining">
                    <th mat-header-cell *matHeaderCellDef class="text-right">Remaining</th>
                    <td mat-cell *matCellDef="let b" class="text-right">
                        <span [class.text-red-500]="b.total_remaining_amount > 0">
                            {{ (b.total_remaining_amount ?? 0) | number:'1.0-0' }} UZS
                        </span>
                    </td>
                </ng-container>

                <ng-container matColumnDef="is_active">
                    <th mat-header-cell *matHeaderCellDef class="text-center">Active</th>
                    <td mat-cell *matCellDef="let b" class="text-center">
                        <mat-icon *ngIf="b.is_active"  class="text-green-500" svgIcon="heroicons_outline:check-circle"></mat-icon>
                        <mat-icon *ngIf="!b.is_active" class="text-red-400"   svgIcon="heroicons_outline:x-circle"></mat-icon>
                    </td>
                </ng-container>

                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef></th>
                    <td mat-cell *matCellDef="let b">
                        <div *ngIf="isSuperAdmin" class="flex justify-end gap-1">
                            <button mat-icon-button (click)="openEdit(b)" matTooltip="Edit">
                                <mat-icon svgIcon="heroicons_outline:pencil-square"></mat-icon>
                            </button>
                            <button mat-icon-button color="warn" (click)="delete(b)" matTooltip="Delete">
                                <mat-icon svgIcon="heroicons_outline:trash"></mat-icon>
                            </button>
                        </div>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-hover"></tr>
            </table>

            <div *ngIf="businesses.length === 0" class="text-center text-secondary py-12">
                No businesses found.
            </div>
        </div>

    </div>

</div>

<div class="flex flex-col flex-auto min-w-0">

    <div class="flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between p-6 sm:py-8 sm:px-10 border-b bg-card dark:bg-transparent">
        <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight leading-7 sm:leading-10 truncate">
            Products
        </h2>
        <button mat-flat-button color="primary" (click)="openCreate()">
            <mat-icon svgIcon="heroicons_outline:plus"></mat-icon>
            <span class="ml-2">New Product</span>
        </button>
    </div>

    <div class="flex flex-col flex-auto p-6 sm:p-10">

        <mat-form-field class="w-full sm:w-80 mb-6">
            <mat-icon matPrefix svgIcon="heroicons_outline:magnifying-glass"></mat-icon>
            <input matInput placeholder="Search products..." [(ngModel)]="searchValue" (ngModelChange)="onSearch($event)">
        </mat-form-field>

        <div *ngIf="loading" class="flex justify-center py-16">
            <mat-progress-spinner mode="indeterminate" [diameter]="40"></mat-progress-spinner>
        </div>

        <div *ngIf="!loading" class="bg-card rounded-2xl shadow overflow-auto">
            <table mat-table [dataSource]="products" class="w-full">

                <ng-container matColumnDef="business_name">
                    <th mat-header-cell *matHeaderCellDef>Business</th>
                    <td mat-cell *matCellDef="let p" class="text-secondary text-sm">{{ p.business_name ?? '—' }}</td>
                </ng-container>

                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>Name</th>
                    <td mat-cell *matCellDef="let p">{{ p.name }}</td>
                </ng-container>

                <ng-container matColumnDef="unit">
                    <th mat-header-cell *matHeaderCellDef>Unit</th>
                    <td mat-cell *matCellDef="let p">{{ p.unit }}</td>
                </ng-container>

                <ng-container matColumnDef="price">
                    <th mat-header-cell *matHeaderCellDef class="text-right">Price</th>
                    <td mat-cell *matCellDef="let p" class="text-right">{{ (p.price ?? 0) | number:'1.0-0' }}</td>
                </ng-container>

                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef></th>
                    <td mat-cell *matCellDef="let p">
                        <div class="flex justify-end gap-1">
                            <button mat-icon-button (click)="openEdit(p)">
                                <mat-icon svgIcon="heroicons_outline:pencil-square"></mat-icon>
                            </button>
                            <button mat-icon-button color="warn" (click)="delete(p)">
                                <mat-icon svgIcon="heroicons_outline:trash"></mat-icon>
                            </button>
                        </div>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-hover"></tr>
            </table>

            <div *ngIf="products.length === 0" class="text-center text-secondary py-12">
                No products found.
            </div>
        </div>

    </div>

</div>

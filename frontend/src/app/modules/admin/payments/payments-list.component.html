<div class="flex flex-col flex-auto min-w-0">

    <div class="flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between p-6 sm:py-8 sm:px-10 border-b bg-card dark:bg-transparent">
        <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight leading-7 sm:leading-10 truncate">
            Payments
        </h2>
        <button mat-flat-button color="primary" (click)="openCreate()">
            <mat-icon svgIcon="heroicons_outline:plus"></mat-icon>
            <span class="ml-2">Record Payment</span>
        </button>
    </div>

    <div class="flex flex-col flex-auto p-6 sm:p-10">

        <div *ngIf="loading" class="flex justify-center py-16">
            <mat-progress-spinner mode="indeterminate" [diameter]="40"></mat-progress-spinner>
        </div>

        <div *ngIf="!loading" class="bg-card rounded-2xl shadow overflow-auto">
            <table mat-table [dataSource]="payments" class="w-full">

                <ng-container matColumnDef="business_name">
                    <th mat-header-cell *matHeaderCellDef>Business</th>
                    <td mat-cell *matCellDef="let p" class="text-secondary text-sm">{{ p.business_name ?? '—' }}</td>
                </ng-container>

                <ng-container matColumnDef="debt_customer">
                    <th mat-header-cell *matHeaderCellDef>Customer</th>
                    <td mat-cell *matCellDef="let p">{{ p.customer_name ?? p.debt }}</td>
                </ng-container>

                <ng-container matColumnDef="amount">
                    <th mat-header-cell *matHeaderCellDef class="text-right">Amount</th>
                    <td mat-cell *matCellDef="let p" class="text-right font-medium text-green-600">
                        {{ p.amount | number:'1.0-0' }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="note">
                    <th mat-header-cell *matHeaderCellDef>Note</th>
                    <td mat-cell *matCellDef="let p">{{ p.note ?? '—' }}</td>
                </ng-container>

                <ng-container matColumnDef="created_at">
                    <th mat-header-cell *matHeaderCellDef>Date</th>
                    <td mat-cell *matCellDef="let p">{{ p.created_at | date:'dd.MM.yyyy' }}</td>
                </ng-container>

                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef></th>
                    <td mat-cell *matCellDef="let p">
                        <button mat-icon-button color="warn" (click)="delete(p)">
                            <mat-icon svgIcon="heroicons_outline:trash"></mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-hover"></tr>
            </table>

            <div *ngIf="payments.length === 0" class="text-center text-secondary py-12">
                No payments recorded.
            </div>
        </div>

    </div>

</div>

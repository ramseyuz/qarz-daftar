<div class="flex flex-col flex-auto min-w-0">

    <div class="flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between p-6 sm:py-8 sm:px-10 border-b bg-card dark:bg-transparent">
        <div class="flex-1 min-w-0">
            <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight leading-7 sm:leading-10 truncate">
                Subscriptions
            </h2>
            <p class="text-secondary mt-1 text-sm">Manage business subscriptions</p>
        </div>
        <button mat-flat-button color="primary" (click)="openCreate()">
            <mat-icon svgIcon="heroicons_outline:plus"></mat-icon>
            <span class="ml-2">Assign Subscription</span>
        </button>
    </div>

    <div class="flex flex-col flex-auto p-6 sm:p-10">
        <div *ngIf="loading" class="flex justify-center py-16">
            <mat-progress-spinner mode="indeterminate" [diameter]="40"></mat-progress-spinner>
        </div>

        <div *ngIf="!loading" class="bg-card rounded-2xl shadow overflow-auto">
            <table mat-table [dataSource]="subscriptions" class="w-full">

                <ng-container matColumnDef="business">
                    <th mat-header-cell *matHeaderCellDef>Business</th>
                    <td mat-cell *matCellDef="let s" class="font-semibold">{{ s.business_name }}</td>
                </ng-container>

                <ng-container matColumnDef="plan">
                    <th mat-header-cell *matHeaderCellDef>Plan</th>
                    <td mat-cell *matCellDef="let s">{{ s.plan_name }}</td>
                </ng-container>

                <ng-container matColumnDef="dates">
                    <th mat-header-cell *matHeaderCellDef>Period</th>
                    <td mat-cell *matCellDef="let s" class="text-sm text-secondary">
                        {{ s.start_date }} → {{ s.end_date }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef class="text-center">Status</th>
                    <td mat-cell *matCellDef="let s" class="text-center">
                        <span class="px-2 py-0.5 rounded-full text-xs font-semibold" [ngClass]="statusClass(s)">
                            {{ statusLabel(s) }}
                        </span>
                    </td>
                </ng-container>

                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef></th>
                    <td mat-cell *matCellDef="let s">
                        <div class="flex justify-end gap-1">
                            <button mat-icon-button matTooltip="Edit / Extend" (click)="openEdit(s)">
                                <mat-icon svgIcon="heroicons_outline:pencil-square"></mat-icon>
                            </button>
                            <button mat-icon-button color="warn" matTooltip="Delete" (click)="delete(s)">
                                <mat-icon svgIcon="heroicons_outline:trash"></mat-icon>
                            </button>
                        </div>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"
                    class="hover:bg-hover" [class.opacity-50]="row.is_expired && !row.is_active"></tr>
            </table>
            <div *ngIf="subscriptions.length === 0" class="text-center text-secondary py-12">
                No subscriptions yet.
            </div>
        </div>
    </div>
</div>

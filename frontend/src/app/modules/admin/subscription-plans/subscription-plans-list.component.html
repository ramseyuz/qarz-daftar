<div class="flex flex-col flex-auto min-w-0">

    <div class="flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between p-6 sm:py-8 sm:px-10 border-b bg-card dark:bg-transparent">
        <div class="flex-1 min-w-0">
            <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight leading-7 sm:leading-10 truncate">
                Subscription Plans
            </h2>
            <p class="text-secondary mt-1 text-sm">Define pricing tiers and resource limits</p>
        </div>
        <button mat-flat-button color="primary" (click)="openCreate()">
            <mat-icon svgIcon="heroicons_outline:plus"></mat-icon>
            <span class="ml-2">New Plan</span>
        </button>
    </div>

    <div class="flex flex-col flex-auto p-6 sm:p-10">
        <div *ngIf="loading" class="flex justify-center py-16">
            <mat-progress-spinner mode="indeterminate" [diameter]="40"></mat-progress-spinner>
        </div>

        <div *ngIf="!loading" class="bg-card rounded-2xl shadow overflow-auto">
            <table mat-table [dataSource]="plans" class="w-full">

                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>Plan</th>
                    <td mat-cell *matCellDef="let p">
                        <div class="font-semibold">{{ p.name }}</div>
                        <div class="text-xs text-secondary">{{ p.description || '—' }}</div>
                    </td>
                </ng-container>

                <ng-container matColumnDef="price">
                    <th mat-header-cell *matHeaderCellDef class="text-right">Price</th>
                    <td mat-cell *matCellDef="let p" class="text-right font-medium">
                        {{ p.price | number:'1.0-0' }} UZS
                    </td>
                </ng-container>

                <ng-container matColumnDef="duration">
                    <th mat-header-cell *matHeaderCellDef class="text-center">Duration</th>
                    <td mat-cell *matCellDef="let p" class="text-center">
                        {{ p.duration_days }} days
                    </td>
                </ng-container>

                <ng-container matColumnDef="limits">
                    <th mat-header-cell *matHeaderCellDef>Limits</th>
                    <td mat-cell *matCellDef="let p">
                        <div class="flex gap-3 text-xs">
                            <span class="px-2 py-0.5 rounded-full bg-blue-50 text-blue-700">👤 {{ p.max_users }} emp</span>
                            <span class="px-2 py-0.5 rounded-full bg-green-50 text-green-700">🏪 {{ p.max_customers }} cust</span>
                            <span class="px-2 py-0.5 rounded-full bg-orange-50 text-orange-700">📄 {{ p.max_debts }} debts</span>
                        </div>
                    </td>
                </ng-container>

                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef></th>
                    <td mat-cell *matCellDef="let p">
                        <div class="flex justify-end gap-1">
                            <button mat-icon-button matTooltip="Edit" (click)="openEdit(p)">
                                <mat-icon svgIcon="heroicons_outline:pencil-square"></mat-icon>
                            </button>
                            <button mat-icon-button color="warn" matTooltip="Delete" (click)="delete(p)">
                                <mat-icon svgIcon="heroicons_outline:trash"></mat-icon>
                            </button>
                        </div>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-hover"></tr>
            </table>
            <div *ngIf="plans.length === 0" class="text-center text-secondary py-12">No plans yet.</div>
        </div>
    </div>
</div>
